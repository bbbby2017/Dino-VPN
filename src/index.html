<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="./assets/image/logo.ico" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DinoVPN</title>
  <style>
    :root {
      --bg-color: #f5f5f5;
      --text-color: #333;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #2e303d;
        --text-color: #ffffff;
        color-scheme: dark;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      color: var(--text-color);
    }

    #root {
      width: 100%;
      height: 100%;
    }

    #initial-loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      z-index: 9999;
      transition: opacity 0.2s ease-out;
    }

    #initial-loading-overlay[data-hidden='true'] {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="initial-loading-overlay"></div>
  <script>
    ;(function () {
      var internals = window.__TAURI_INTERNALS__
      if (!internals) return

      // 顶栏页面子窗口：/?window=xxx 重写到对应路由（必须在路由初始化前执行），
      // 让子窗口与主窗口加载完全同构的入口页，避免子路径加载差异
      try {
        var w = new URLSearchParams(location.search).get('window')
        var map = {
          profile: '/profiles',
          connections: '/connections',
          logs: '/logs',
          settings: '/settings',
        }
        if (w && map[w]) history.replaceState(null, '', map[w])
      } catch (e) { }

      // 只在主窗口执行主窗口的显示/聚焦，避免子窗口加载时抢夺主窗口焦点
      var isMain =
        internals.metadata &&
        internals.metadata.currentWindow &&
        internals.metadata.currentWindow.label === 'main'
      if (isMain) {
        internals
          .invoke('plugin:window|show', { label: 'main' })
          .catch(function () { })
        internals
          .invoke('plugin:window|set_focus', { label: 'main' })
          .catch(function () { })
      }
    })()
  </script>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>

</html>
