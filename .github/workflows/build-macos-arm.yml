name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      windows_x64:
        description: 'Windows x64'
        type: boolean
        default: true
      windows_arm64:
        description: 'Windows ARM64'
        type: boolean
        default: false
      macos_arm64:
        description: 'macOS ARM64 (Apple Silicon)'
        type: boolean
        default: true
      macos_x64:
        description: 'macOS x64 (Intel)'
        type: boolean
        default: true
      linux_x64:
        description: 'Linux x64'
        type: boolean
        default: true
      linux_arm64:
        description: 'Linux ARM64'
        type: boolean
        default: false
      linux_armv7:
        description: 'Linux ARMv7'
        type: boolean
        default: false

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  setup_matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
      linux_arm_matrix: ${{ steps.set-matrix.outputs.linux_arm_matrix }}
    steps:
      - id: set-matrix
        run: |
          python3 -c '
          import json, os
          is_dispatch = "${{ github.event_name }}" == "workflow_dispatch"
          inputs = {
              "windows_x64": "${{ inputs.windows_x64 }}" != "false",
              "windows_arm64": "${{ inputs.windows_arm64 }}" == "true",
              "macos_arm64": "${{ inputs.macos_arm64 }}" != "false",
              "macos_x64": "${{ inputs.macos_x64 }}" != "false",
              "linux_x64": "${{ inputs.linux_x64 }}" != "false",
          }
          builds = []
          if not is_dispatch or inputs["windows_x64"]:
            builds.append({"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "label": "Windows x64", "artifact-path": "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe"})
          if not is_dispatch or inputs["windows_arm64"]:
             builds.append({"os": "windows-latest", "target": "aarch64-pc-windows-msvc", "label": "Windows ARM64", "artifact-path": "target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe"})
          if not is_dispatch or inputs["macos_arm64"]:
             builds.append({"os": "macos-latest", "target": "aarch64-apple-darwin", "label": "macOS ARM64 (Apple Silicon)", "artifact-path": "target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"})
          if not is_dispatch or inputs["macos_x64"]:
             builds.append({"os": "macos-latest", "target": "x86_64-apple-darwin", "label": "macOS x64 (Intel)", "artifact-path": "target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"})
          if not is_dispatch or inputs["linux_x64"]:
             builds.append({"os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "label": "Linux x64", "artifact-path": "target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb\ntarget/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm"})
          
          linux_arms = []
          if not is_dispatch or inputs.get("linux_arm64") == True:
             linux_arms.append({"os": "ubuntu-22.04", "target": "aarch64-unknown-linux-gnu", "arch": "arm64", "label": "Linux ARM64"})
          if not is_dispatch or inputs.get("linux_armv7") == True:
             linux_arms.append({"os": "ubuntu-22.04", "target": "armv7-unknown-linux-gnueabihf", "arch": "armhf", "label": "Linux ARMv7"})
          
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
             f.write(f"build_matrix={json.dumps(builds)}\n")
             f.write(f"linux_arm_matrix={json.dumps(linux_arms)}\n")
          '

  build:
    needs: setup_matrix
    if: needs.setup_matrix.outputs.build_matrix != '[]'
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup_matrix.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.0'
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust'
          key: 'rust-build-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install x86 OpenSSL (macOS Intel only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          arch -x86_64 brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and prebuild
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Build (ignore signing error)
        run: pnpm build --target ${{ matrix.target }} || true
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Ad-hoc sign and repack DMG (macOS only)
        if: startsWith(matrix.os, 'macos')
        run: |
          APP_PATH="target/${{ matrix.target }}/release/bundle/macos/Clash Verge.app"
          DMG_DIR="target/${{ matrix.target }}/release/bundle/dmg"

          echo "==> Signing .app with ad-hoc identity..."
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify "$APP_PATH" && echo "==> Signature OK" || echo "==> Signature verify failed (non-fatal)"

          echo "==> Removing old DMG..."
          rm -f "$DMG_DIR"/*.dmg

          echo "==> Creating new signed DMG with Applications shortcut..."
          VERSION=$(cat package.json | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])")
          if [ "${{ matrix.target }}" == "aarch64-apple-darwin" ]; then
            ARCH="aarch64"
          else
            ARCH="x64"
          fi
          DMG_FILE="$DMG_DIR/Clash Verge_${VERSION}_${ARCH}.dmg"

          # Create staging folder with .app + Applications symlink
          STAGING="/tmp/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "Clash Verge" -srcfolder "$STAGING" -ov -format UDZO "$DMG_FILE"
          rm -rf "$STAGING"
          echo "==> DMG created: $DMG_FILE"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.artifact-path }}
          retention-days: 30
          if-no-files-found: error

  build-linux-arm:
    needs: setup_matrix
    if: needs.setup_matrix.outputs.linux_arm_matrix != '[]'
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup_matrix.outputs.linux_arm_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.0'
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust'
          key: 'rust-build-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Pnpm install and prebuild
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Setup cross-compile environment
        run: |-
          sudo ls -lR /etc/apt/

          cat > /tmp/sources.list << EOF
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted

          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF

          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt update

          sudo apt install -y \
            libxslt1.1:${{ matrix.arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.arch }} \
            libayatana-appindicator3-dev:${{ matrix.arch }} \
            libssl-dev:${{ matrix.arch }} \
            patchelf:${{ matrix.arch }} \
            librsvg2-dev:${{ matrix.arch }}

      - name: Install aarch64 tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Install armv7 tools
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo apt install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

      - name: Build for Linux ARM (ignore signing error)
        run: |
          export PKG_CONFIG_ALLOW_CROSS=1
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig/:$PKG_CONFIG_PATH
            export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig/:$PKG_CONFIG_PATH
            export PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/
          fi
          pnpm build --target ${{ matrix.target }} || true
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Upload Linux ARM packages
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          retention-days: 30
          if-no-files-found: error
